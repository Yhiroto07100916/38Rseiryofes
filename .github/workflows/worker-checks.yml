name: Worker checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/presence-aware-notifications

permissions:
  contents: read

jobs:
  worker:
    name: Worker tests and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Worker tests
        run: npm test

      - name: Typecheck Worker
        run: npx tsc --noEmit -p tsconfig.json
