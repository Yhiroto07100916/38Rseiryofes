name: Worker tests

on:
  pull_request:
    branches:
      - develop
    paths:
      - "worker/**"
      - "migrations/**"
      - ".github/workflows/worker-tests.yml"
  push:
    branches:
      - develop
    paths:
      - "worker/**"
      - "migrations/**"
      - ".github/workflows/worker-tests.yml"

permissions:
  contents: read

jobs:
  worker-tests:
    name: Worker tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix worker

      - name: Run Worker tests
        run: npm test --prefix worker
